  - name: "Changelog"
    image: "https://img.shields.io/badge/Changelog-blue"
    url: "CHANGELOG.md"

# Prerequisites
prerequisites:
  - name: "Terraform"
    url: "https://learn.hashicorp.com/terraform/getting-started/install.html"
    version: ">= 1.13.3"

# Providers
providers:
  - name: "google"
    url: "https://registry.terraform.io/providers/hashicorp/google"
    version: ">= 5.31.0"

# Module dependencies
module_dependencies:
  - name: "Labels Module"
    url: "https://github.com/opsstation/terraform-multicloud-labels"
    description: "Provides resource tagging."

# Project description
description: |-
  Terraform module for creating VPC networks in GCP. This module can be used as a baseline to create new modules.

# Usage examples
usage: |-
  ### Basic VPC Example
  ```hcl
  module "vpc" {
    source                                    = "opsstation/vpc/gcp"
    version                                   = "1.0.1"
    name                                      = "vpc"
    environment                               = "OpsStation"
    label_order                               = ["name", "environment"]
    mtu                                       = 1460
    routing_mode                              = "REGIONAL"
    network_enabled                           = true
    network_firewall_policy_enforcement_order = "AFTER_CLASSIC_FIREWALL"
    delete_default_routes_on_create           = false
  }
