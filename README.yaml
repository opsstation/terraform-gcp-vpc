name: Terraform GCP VPC
license: APACHE
github_repo: opsstation/terraform-gcp-vpc

badges:
  - name: "Latest Release"
    image: "https://img.shields.io/github/release/opsstation/terraform-gcp-vpc.svg"
    url: "https://github.com/opsstation/terraform-gcp-vpc/releases/latest"
  - name: "tfsec"
    image: "https://github.com/opsstation/terraform-gcp-vpc/actions/workflows/tfsec.yml/badge.svg"
    url: "https://github.com/opsstation/terraform-gcp-vpc/actions/workflows/tfsec.yml"
  - name: "License"
    image: "https://img.shields.io/badge/License-APACHE-blue.svg"
    url: "LICENSE.md"

prerequisites:
  - name: Terraform
    url: https://learn.hashicorp.com/terraform/getting-started/install.html
    version: ">= 1.13.3"

providers:
  - name: google
    url: https://registry.terraform.io/providers/hashicorp/google
    version: ">= 5.31.0"

description: "Terraform module vpc to create new modules using this as baseline"

usage: |
  module "vpc" {
    source  = "opsstation/vpc/gcp"
    version = "1.0.1"
    name    = "vpc"
    environment = "OpsStation"
    label_order = ["name", "environment"]
    mtu = 1460
    routing_mode = "REGIONAL"
    network_enabled = true
    network_firewall_policy_enforcement_order = "AFTER_CLASSIC_FIREWALL"
    delete_default_routes_on_create = false
  }
